<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Scoreboard Overlay</title>
  <style>
    :root {
      --bg: #07110f;
      --panel: rgba(8, 14, 20, 0.74);
      --text: #f7fafc;
      --muted: #cbd5e1;
      --line: rgba(255, 255, 255, 0.18);
      --win: #23c55e;
      --lose: #ef4444;
      --draw: #f8fafc;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      overflow-x: hidden;
      overflow-y: auto;
    }

    body.view-ticker {
      overflow: hidden;
    }

    body.with-bg {
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .app {
      min-height: 100vh;
      padding: 24px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.44));
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 72px;
      margin-bottom: 18px;
      text-align: center;
    }

    .header img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 68px);
      font-weight: 800;
      line-height: 1.05;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
    }

    .status {
      display: grid;
      place-items: center;
      min-height: 240px;
      color: var(--muted);
      font-size: 28px;
      font-weight: 700;
      text-align: center;
    }

    table {
      width: min(1400px, 96vw);
      margin: 0 auto;
      border-collapse: collapse;
      overflow: hidden;
      background: var(--panel);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line);
    }

    th,
    td {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      text-align: center;
      font-size: clamp(20px, 2.2vw, 32px);
      font-weight: 750;
    }

    th {
      color: var(--muted);
      background: rgba(0, 0, 0, 0.28);
    }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
    }

    .logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .results {
      width: min(1400px, 96vw);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .date-group {
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }

    .date-title {
      padding: 14px 20px;
      color: var(--muted);
      font-size: clamp(20px, 2.2vw, 30px);
      font-weight: 800;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }

    .match-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 160px minmax(0, 1fr);
      align-items: center;
      gap: 20px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      font-size: clamp(22px, 2.8vw, 42px);
      font-weight: 850;
    }

    .match-row:last-child { border-bottom: 0; }
    .side-a { justify-content: end; text-align: right; }
    .side-b { justify-content: start; text-align: left; }
    .team-side { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .team-side span { overflow-wrap: anywhere; }
    .score { text-align: center; color: var(--accent); white-space: nowrap; }
    .win { color: var(--win); }
    .lose { color: var(--lose); }
    .draw { color: var(--draw); }

    .ticker-shell {
      position: fixed;
      inset: auto 0 0;
      background: #00ff00;
      padding: 18px 0;
      overflow: hidden;
    }

    .ticker {
      display: inline-flex;
      align-items: center;
      gap: 36px;
      padding-left: 100%;
      color: #ffffff;
      font-size: clamp(16px, 3vw, 42px);
      font-weight: 900;
      white-space: nowrap;
      animation: scroll-left var(--ticker-duration, 42s) linear infinite;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .ticker .logo {
      width: 110px;
      height: 110px;
    }

    .ticker-score {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 6px;
      color: #111827;
      background: #ffffff;
      text-shadow: none;
    }

    @keyframes scroll-left {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }

    /* Stadium Overlay Styles */
    body.view-stadium {
      overflow: hidden;
    }

    .stadium-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .stadium-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .stadium-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7));
    }

    .stadium-content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 32px;
    }

    .stadium-table {
      width: min(900px, 90vw);
      margin: 0 auto 40px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .stadium-table table {
      width: 100%;
      background: transparent;
      border: none;
    }

    .stadium-table th {
      background: rgba(0, 0, 0, 0.5);
      padding: 14px 12px;
      font-size: clamp(14px, 1.5vw, 20px);
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
    }

    .stadium-table td {
      padding: 10px 12px;
      font-size: clamp(14px, 1.5vw, 20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stadium-table tbody tr:last-child td {
      border-bottom: none;
    }

    .stadium-table .team-cell {
      gap: 10px;
    }

    .stadium-table .logo {
      width: 36px;
      height: 36px;
    }

    .stadium-league-title {
      text-align: center;
      margin-bottom: 32px;
    }

    .stadium-league-title h1 {
      font-size: clamp(28px, 5vw, 64px);
      font-weight: 900;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
      margin: 0;
      letter-spacing: 1px;
    }

    .stadium-matches {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }

    .matches-card {
      width: min(750px, 90vw);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .matches-header {
      background: linear-gradient(135deg, #475569, #64748b);
      padding: 16px 24px;
      text-align: center;
    }

    .matches-date {
      margin: 0;
      color: #ffffff;
      font-size: clamp(18px, 2vw, 28px);
      font-weight: 800;
    }

    .matches-list {
      padding: 0;
    }

    .match-card {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      background: #ffffff;
      transition: background 0.2s;
    }

    .match-card:hover {
      background: rgba(248, 250, 252, 0.8);
    }

    .match-card:last-child {
      border-bottom: none;
    }

    .match-team {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(16px, 1.8vw, 24px);
      font-weight: 700;
      color: #1e293b;
    }

    .match-team.left {
      justify-content: flex-end;
      text-align: right;
    }

    .match-team.right {
      justify-content: flex-start;
      text-align: left;
    }

    .match-team .logo {
      width: 48px;
      height: 48px;
    }

    .match-score {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: clamp(20px, 2.5vw, 36px);
      font-weight: 900;
      color: #0f172a;
      padding: 8px 16px;
      background: rgba(241, 245, 249, 0.6);
      border-radius: 8px;
      min-width: 80px;
    }

    .match-team.win {
      color: #059669;
    }

    .match-team.lose {
      color: #dc2626;
      opacity: 0.7;
    }

    .match-team.draw {
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header" id="header"></header>
    <section id="content" class="status">Loading...</section>
  </main>

  <script type="module" src="fcp_v2_assets/overlay.js"></script>
</body>
</html>
